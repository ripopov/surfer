# UI palette ported from egui-table/src/theme.rs. Trace/source colors adapted for contrast.
foreground = "#e2eaf6"
alt_text_color = "#172131"
border_color = "#314156"
variable_default = "#a6da95"
variable_undef = "#ff7b86"
variable_highimp = "#eed49f"
variable_dontcare = "#86b1ff"
variable_weak = "#97a8c0"
variable_parameter = "#e2eaf6"
variable_event = "#86b1ff"
transaction_default = "#86b1ff"
highlight_background = "#2b446c"
clock_highlight_cycle = "#1c283a"
primary_ui_color = { background = "#172131", foreground = "#e2eaf6" }
secondary_ui_color = { background = "#0f1623", foreground = "#e2eaf6" }
selected_elements_colors = { background = "#2b446c", foreground = "#e2eaf6" }
accent_info = { background = "#86b1ff", foreground = "#172131" }
accent_warn = { background = "#1c283a", foreground = "#e2eaf6" }
accent_error = { background = "#172131", foreground = "#ff7b86" }
canvas_colors = { background = "#0f1623", alt_background = "#1c283a", foreground = "#e2eaf6" }
tile_focus_stroke = { color = "#86b1ff", width = 1 }
clock_highlight_line = { color = "#314156", width = 1 }
cursor = { color = "#86b1ff", width = 1 }
gesture = { color = "#86b1ff", width = 1 }
measure = { color = "#97a8c0", width = 1 }
annotation_rectangle = { color = "#86b1ff", width = 1 }
annotation_arrow = { color = "#86b1ff", width = 1 }
viewport_separator = { color = "#314156", width = 1 }

[ui]
dark_mode = true
muted = "#97a8c0"
accent = "#86b1ff"
subtle = "#1c283a"
hover = "#24354d"

[ticks]
style = { color = "#314156", width = 1 }

[source]
keyword = "#86b1ff"
comment = "#97a8c0"
number = "#86b1ff"
string = "#a6da95"
operator = "#e2eaf6"
macro_ = "#86b1ff"
variable = "#e2eaf6"
input = "#86b1ff"
output = "#86b1ff"
inout = "#86b1ff"
clock = "#86b1ff"
parameter = "#86b1ff"
enum_member = "#86b1ff"
type_ = "#86b1ff"
module = "#86b1ff"
instance = "#86b1ff"
function = "#86b1ff"
property = "#e2eaf6"
inactive = "#97a8c0"
target_line = "#2b446c"
inactive_background = "#1c283a"
value = "#a6da95"
value_changed = "#86b1ff"
value_unknown = "#ff7b86"
