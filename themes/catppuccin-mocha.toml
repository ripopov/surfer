# UI palette ported from egui-table/src/theme.rs. Trace/source colors adapted for contrast.
foreground = "#cdd6f4"
alt_text_color = "#1e1e2e"
border_color = "#45475a"
variable_default = "#a6da95"
variable_undef = "#ff7b86"
variable_highimp = "#eed49f"
variable_dontcare = "#cba6f7"
variable_weak = "#bac2de"
variable_parameter = "#cdd6f4"
variable_event = "#cba6f7"
transaction_default = "#cba6f7"
highlight_background = "#45405e"
clock_highlight_cycle = "#242437"
primary_ui_color = { background = "#1e1e2e", foreground = "#cdd6f4" }
secondary_ui_color = { background = "#181825", foreground = "#cdd6f4" }
selected_elements_colors = { background = "#45405e", foreground = "#cdd6f4" }
accent_info = { background = "#cba6f7", foreground = "#1e1e2e" }
accent_warn = { background = "#242437", foreground = "#cdd6f4" }
accent_error = { background = "#1e1e2e", foreground = "#ff7b86" }
canvas_colors = { background = "#181825", alt_background = "#242437", foreground = "#cdd6f4" }
tile_focus_stroke = { color = "#cba6f7", width = 1 }
clock_highlight_line = { color = "#45475a", width = 1 }
cursor = { color = "#cba6f7", width = 1 }
gesture = { color = "#cba6f7", width = 1 }
measure = { color = "#bac2de", width = 1 }
annotation_rectangle = { color = "#cba6f7", width = 1 }
annotation_arrow = { color = "#cba6f7", width = 1 }
viewport_separator = { color = "#45475a", width = 1 }

[ui]
dark_mode = true
muted = "#bac2de"
accent = "#cba6f7"
subtle = "#242437"
hover = "#313244"

[ticks]
style = { color = "#45475a", width = 1 }

[source]
keyword = "#cba6f7"
comment = "#bac2de"
number = "#cba6f7"
string = "#a6da95"
operator = "#cdd6f4"
macro_ = "#cba6f7"
variable = "#cdd6f4"
input = "#cba6f7"
output = "#cba6f7"
inout = "#cba6f7"
clock = "#cba6f7"
parameter = "#cba6f7"
enum_member = "#cba6f7"
type_ = "#cba6f7"
module = "#cba6f7"
instance = "#cba6f7"
function = "#cba6f7"
property = "#cdd6f4"
inactive = "#bac2de"
target_line = "#45405e"
inactive_background = "#242437"
value = "#a6da95"
value_changed = "#cba6f7"
value_unknown = "#ff7b86"
