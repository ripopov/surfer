<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Surfer Ultra — Aurora</title>
  <desc id="desc">The original white Surfer mascot on an outlined board, surrounded by a continuous violet-to-mint Saturn orbit on a midnight-blue tile.</desc>
  <defs>
    <linearGradient id="orbit" gradientUnits="userSpaceOnUse" x1="56" y1="320" x2="456" y2="180">
      <stop stop-color="#7c6cff"/><stop offset=".5" stop-color="#5ec8ff"/><stop offset="1" stop-color="#a0ffe6"/>
    </linearGradient>
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="256" cy="220" r="340">
      <stop stop-color="#202947"/><stop offset="1" stop-color="#10152b"/>
    </radialGradient>
    <!-- Depth fades out at the ellipse ends, avoiding visible half-ring seams. -->
    <linearGradient id="rear-depth" gradientUnits="userSpaceOnUse" x1="0" y1="178" x2="0" y2="262">
      <stop stop-color="#10152b" stop-opacity=".36"/><stop offset="1" stop-color="#10152b" stop-opacity="0"/>
    </linearGradient>
    <!-- Clear only the mascot/board at the front crossing, not the orbit ends. -->
    <mask id="front-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" style="mask-type:luminance">
      <rect width="512" height="512" fill="white"/>
      <path d="M56 262a200 84 0 0 0 400 0" transform="rotate(-8 256 262)" fill="none" stroke="black" stroke-width="38"/>
    </mask>
  </defs>
  <g transform="scale(.5)">
    <rect width="512" height="512" rx="116" fill="url(#tile)"/>
    <g transform="rotate(-8 256 262)" fill="none" stroke-width="24">
      <ellipse cx="256" cy="262" rx="200" ry="84" stroke="url(#orbit)"/>
      <path d="M56 262a200 84 0 0 1 400 0" stroke="url(#rear-depth)"/>
    </g>
